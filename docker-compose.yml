services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  client:
    build: ./client
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
